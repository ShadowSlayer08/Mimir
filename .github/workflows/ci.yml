name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests + KB + evals (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest cryptography pyyaml
      - name: Run tests
        run: python run_tests.py
      - name: Validate knowledge base
        run: python validate_kb.py
      - name: Eval harness
        run: python -m evals.bench
      - name: Boundary grep — no payloads / C2 / auto-exploit text
        shell: bash
        run: |
          # Scan the shipped source only (not tests / docs / fixtures) for forbidden content.
          BAD=$(grep -rEn -i \
            --include='*.py' \
            --exclude-dir=tests \
            --exclude-dir=evals \
            --exclude-dir=exploits \
            --exclude-dir=build \
            --exclude-dir=.github \
            'reverse_shell\s*=|bind_shell\s*=|c2[-_]framework|cobalt[-_]strike' \
            . || true)
          if [ -n "$BAD" ]; then
            echo "::error::constitution violation — payload/C2 text found:"
            echo "$BAD"
            exit 1
          fi
          echo "boundary clean."
