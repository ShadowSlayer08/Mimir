name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Tests + KB validation across all three target OSes — catches portability
  # regressions (the whole point of going cross-platform).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML requests colorama cryptography
      - name: Validate knowledge base
        run: python validate_kb.py
      - name: Run tests
        run: python run_tests.py

  # Build the native thick-client binary on each OS and publish it as an
  # artifact. PyInstaller can't cross-compile, so this is how all three are
  # produced from one push (Windows .exe / Linux ELF / macOS .app).
  build:
    name: build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux Qt runtime libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libegl1
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyYAML requests colorama cryptography pyinstaller
      - name: Build native binary
        run: python build_app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedEngine-${{ matrix.os }}
          path: |
            dist/RedEngine
            dist/RedEngine.exe
            dist/RedEngine.app
          if-no-files-found: ignore
