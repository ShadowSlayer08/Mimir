[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir-plugin-example"
version = "0.1.0"
description = "Example third-party module for Mimir — copy and rename."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Mimir plugin example author" }]

# Mimir itself is NOT a runtime dependency — a plugin only needs the stable
# `mimir.sdk` surface, which ships with the mimir package. If you want to run
# the plugin's unit tests outside a mimir checkout, add `mimir` here.

[project.entry-points."mimir.modules"]
example_hello = "example_hello:HelloModule"

[tool.setuptools]
packages = ["example_hello"]
