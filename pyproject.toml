[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir"
version = "6.0.0"
description = "Mimir — knowledge-driven pentest orchestration engine (methodology + staging only) for authorized / lab / CTF / VAPT / red-team use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Mimir" }]
keywords = ["pentest", "vapt", "red-team", "nmap", "attack-paths", "mitre-attack", "orchestration", "methodology", "staging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

# Core runtime: deliberately minimal. The headless / CLI engine runs on these
# four alone. Qt and the operator toolkit are optional extras below.
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
    "colorama>=0.4",
    "cryptography>=41",
]

[project.optional-dependencies]
# GUI thick client. Required by the mimir console script: pip install mimir[gui]
gui = ["PySide6>=6.5"]
# Operator red-team toolkit (staging/handoff helpers; the engine never auto-runs them).
redteam = ["impacket", "pymetasploit3", "python-nmap", "beautifulsoup4"]
# Standalone native-binary build toolchain.
build = ["pyinstaller"]
# Nicer CLI rendering (optional; engine degrades to plain colorama without it).
rich = ["rich>=13"]
# Convenience: everything an operator workstation wants.
all = ["PySide6>=6.5", "impacket", "pymetasploit3", "python-nmap", "beautifulsoup4", "rich>=13"]

[project.urls]
Homepage = "https://github.com/your-org/mimir"
Repository = "https://github.com/your-org/mimir"
Issues = "https://github.com/your-org/mimir/issues"

[project.scripts]
mimir = "mimir_app:main"
mimir-cli = "assess:main"
mimir-scan = "nmap_analyzer:main"
mimir-web = "webapi:main"
mimir-adgraph = "ad_graph:main"
mimir-copilot = "copilot:main"
mimir-advisor = "advisor:main"
mimir-mcp = "mcp_server:main"
mimir-bench = "evals.bench:main"
mimir-lessons = "lessons:main"
mimir-exploits = "exploit_refs:main"
mimir-roe = "roe:main"
mimir-timeline = "timeline:main"
mimir-vault = "vault:main"
mimir-opsec = "opsec:main"
mimir-ct = "ct_monitor:main"
mimir-roe-parse = "roe_parse:main"

# Flat layout: enumerate every shipped top-level module explicitly, plus the
# modules/ code package and the docs/ knowledge base as importable DATA
# packages. No automatic discovery. exploits/, build_*, run_tests, conftest and
# tests/ are intentionally omitted from the distribution.
[tool.setuptools]
py-modules = [
    "mimir_app",
    "attack_dashboard",
    "pentest_console",
    "assess",
    "nmap_analyzer",
    "attack_path_engine",
    "knowledge_loader",
    "profiles",
    "evidence",
    "reporting",
    "ledger",
    "killchain",
    "device_profile",
    "abuse",
    "containers",
    "config",
    "findings",
    "apptargets",
    "webapi",
    "ad_graph",
    "copilot",
    "context",
    "llm",
    "advisor",
    "qualia",
    "lessons",
    "exploit_refs",
    "cvss4",
    "roe",
    "timeline",
    "vault",
    "opsec",
    "ct_monitor",
    "roe_parse",
    "mcp_server",
    "ciphers",
    "ciphers_v4",
    "validate_kb",
]
# 'docs' / 'docs.modules' are data-only packages carrying the Markdown KB so it
# ships in the wheel and is addressable via importlib.resources.files('docs').
# Requires docs/__init__.py and docs/modules/__init__.py marker files.
packages = ["modules", "docs", "docs.modules", "docs.appsec", "evals", "sdk"]
include-package-data = true

[tool.setuptools.package-data]
"docs" = ["*.md"]
"evals" = ["scenarios/*.yml"]
"docs.modules" = ["*.md"]
"docs.appsec" = ["*.md"]
